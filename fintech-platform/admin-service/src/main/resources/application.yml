spring:
  application:
    name: admin-service

  datasource:
    url: jdbc:postgresql://localhost:5432/fintech_admin
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  cache:
    type: simple

server:
  port: 8086

feign:
  client:
    user-service:
      url: http://localhost:8082
    wallet-service:
      url: http://localhost:8083
    transaction-service:
      url: http://localhost:8084

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.fintech.admin: DEBUG
    org.springframework.web: DEBUG
    org.springframework.cloud.openfeign: DEBUG
